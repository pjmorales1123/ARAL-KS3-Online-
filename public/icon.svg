<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Sun Rays / Torch Glow behind book -->
  <circle cx="256" cy="200" r="140" fill="url(#goldGrad)" opacity="0.2" filter="blur(20px)" />
  
  <!-- Stylized DepEd ARAL Book Graphics -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Sun Star on top -->
    <path d="M 256,110 L 263,128 L 282,130 L 267,143 L 272,162 L 256,151 L 240,162 L 245,143 L 230,130 L 249,128 Z" fill="url(#goldGrad)" />

    <!-- Open Book Left Page -->
    <path d="M 246,180 C 190,170 130,185 96,205 L 96,365 C 130,345 190,332 246,342 Z" fill="#ffffff" />
    <!-- Book Left Page Shading Lines -->
    <path d="M 130,230 C 165,220 205,220 235,226 M 130,260 C 165,250 205,250 235,256 M 130,290 C 165,280 205,280 235,286" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Open Book Right Page -->
    <path d="M 266,180 C 322,170 382,185 416,205 L 416,365 C 382,345 322,332 266,342 Z" fill="#f8fafc" />
    <!-- Book Right Page Shading Lines -->
    <path d="M 277,226 C 307,220 347,220 382,230 M 277,256 C 307,250 347,250 382,260 M 277,286 C 307,280 347,280 382,290" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Book Spine Center Fold -->
    <path d="M 256,178 L 256,350" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Bookmark Ribbon -->
    <path d="M 256,185 L 256,330 L 268,318 L 280,330 L 280,185 Z" fill="#f59e0b" opacity="0.9" />
  </g>

  <!-- ARAL Pill Badge at bottom -->
  <g transform="translate(256, 420)">
    <rect x="-110" y="-32" width="220" height="64" rx="32" fill="#ffffff" filter="url(#dropShadow)" />
    <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#be123c" text-anchor="middle" letter-spacing="4">ARAL</text>
  </g>
</svg>
